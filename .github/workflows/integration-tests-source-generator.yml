name: Integration Tests - Source Generator Template

on:
  push:
    branches: [ main ]
    paths:
      - 'templates/SourceGeneratorTemplate/**'
      - '.github/workflows/integration-tests-source-generator.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'templates/SourceGeneratorTemplate/**'
      - '.github/workflows/integration-tests-source-generator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # .NET 9 — default generator framework (netstandard2.0), all test projects
          - name: "net9 | all options | netstandard2.0 generator"
            dotnet-version: '9.x'
            dotnet-quality: 'ga'
            framework: 'net9.0'
            generator-framework: 'netstandard2.0'
            include-tests: 'true'
            include-snapshot-tests: 'true'

          # .NET 9 — net8.0 generator, all test projects
          - name: "net9 | all options | net8.0 generator"
            dotnet-version: '9.x'
            dotnet-quality: 'ga'
            framework: 'net9.0'
            generator-framework: 'net8.0'
            include-tests: 'true'
            include-snapshot-tests: 'true'

          # .NET 9 — net9.0 generator, all test projects
          - name: "net9 | all options | net9.0 generator"
            dotnet-version: '9.x'
            dotnet-quality: 'ga'
            framework: 'net9.0'
            generator-framework: 'net9.0'
            include-tests: 'true'
            include-snapshot-tests: 'true'

          # .NET 10 — net10.0 generator, all test projects
          - name: "net10 | all options | net10.0 generator"
            dotnet-version: '10.x'
            dotnet-quality: 'ga'
            framework: 'net10.0'
            generator-framework: 'net10.0'
            include-tests: 'true'
            include-snapshot-tests: 'true'

          # .NET 10 — default generator framework (netstandard2.0), all test projects
          - name: "net10 | all options | netstandard2.0 generator"
            dotnet-version: '10.x'
            dotnet-quality: 'ga'
            framework: 'net10.0'
            generator-framework: 'netstandard2.0'
            include-tests: 'true'
            include-snapshot-tests: 'true'

          # .NET 9 — defaults for optional test toggles (snapshot tests should be off)
          - name: "net9 | default test toggles"
            dotnet-version: '9.x'
            dotnet-quality: 'ga'
            framework: 'net9.0'
            generator-framework: 'netstandard2.0'

          # .NET 9 — generator only (no test projects)
          - name: "net9 | generator only"
            dotnet-version: '9.x'
            dotnet-quality: 'ga'
            framework: 'net9.0'
            generator-framework: 'netstandard2.0'
            include-tests: 'false'
            include-snapshot-tests: 'false'

          # .NET 9 — unit tests only (no snapshot tests)
          - name: "net9 | unit tests only"
            dotnet-version: '9.x'
            dotnet-quality: 'ga'
            framework: 'net9.0'
            generator-framework: 'netstandard2.0'
            include-tests: 'true'
            include-snapshot-tests: 'false'

          # .NET 9 — snapshot tests only (no unit tests)
          - name: "net9 | snapshot tests only"
            dotnet-version: '9.x'
            dotnet-quality: 'ga'
            framework: 'net9.0'
            generator-framework: 'netstandard2.0'
            include-tests: 'false'
            include-snapshot-tests: 'true'

          # .NET 9 — ForAttributeWithMetadataName, netstandard2.0 generator
          - name: "net9 | ForAttributeWithMetadataName | netstandard2.0 generator"
            dotnet-version: '9.x'
            dotnet-quality: 'ga'
            framework: 'net9.0'
            generator-framework: 'netstandard2.0'
            include-tests: 'true'
            include-snapshot-tests: 'true'
            syntax-provider-mode: 'ForAttributeWithMetadataName'

          # .NET 10 — ForAttributeWithMetadataName, net10.0 generator
          - name: "net10 | ForAttributeWithMetadataName | net10.0 generator"
            dotnet-version: '10.x'
            dotnet-quality: 'ga'
            framework: 'net10.0'
            generator-framework: 'net10.0'
            include-tests: 'true'
            include-snapshot-tests: 'true'
            syntax-provider-mode: 'ForAttributeWithMetadataName'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          dotnet-quality: ${{ matrix.dotnet-quality }}

      - name: Install template from local source
        run: dotnet new install ./templates/SourceGeneratorTemplate/

      - name: Generate project from template
        working-directory: /tmp
        run: |
          SYNTAX_MODE="${{ matrix.syntax-provider-mode }}"
          INCLUDE_TESTS="${{ matrix.include-tests }}"
          INCLUDE_SNAPSHOT_TESTS="${{ matrix.include-snapshot-tests }}"
          EXTRA_ARGS=()

          if [ -n "$SYNTAX_MODE" ]; then
            EXTRA_ARGS+=(--SyntaxProviderMode "$SYNTAX_MODE")
          fi

          if [ -n "$INCLUDE_TESTS" ]; then
            EXTRA_ARGS+=(--IncludeTests "$INCLUDE_TESTS")
          fi

          if [ -n "$INCLUDE_SNAPSHOT_TESTS" ]; then
            EXTRA_ARGS+=(--IncludeSnapshotTests "$INCLUDE_SNAPSHOT_TESTS")
          fi

          dotnet new cni-sourcegen \
            --name TestGenerator \
            --Framework "${{ matrix.framework }}" \
            --GeneratorFramework "${{ matrix.generator-framework }}" \
            "${EXTRA_ARGS[@]}"

      - name: Verify generated file structure
        shell: bash
        run: |
          BASE="/tmp/TestGenerator"
          EXIT_CODE=0

          check_file() {
            if [ ! -f "$1" ]; then
              echo "::error::Missing expected file: $1"
              EXIT_CODE=1
            else
              echo "✓ Found: $1"
            fi
          }

          check_absent() {
            if [ -e "$1" ]; then
              echo "::error::Unexpected path (should not exist): $1"
              EXIT_CODE=1
            else
              echo "✓ Correctly absent: $1"
            fi
          }

          # Generator project
          check_file "$BASE/TestGenerator/TestGenerator.csproj"
          check_file "$BASE/TestGenerator/TestGeneratorImpl.cs"

          # Solution and README
          check_file "$BASE/TestGenerator.slnx"
          check_file "$BASE/README.md"

          INCLUDE_TESTS="${{ matrix.include-tests }}"
          if [ -z "$INCLUDE_TESTS" ]; then
            INCLUDE_TESTS="true"
          fi

          INCLUDE_SNAPSHOT_TESTS="${{ matrix.include-snapshot-tests }}"
          if [ -z "$INCLUDE_SNAPSHOT_TESTS" ]; then
            INCLUDE_SNAPSHOT_TESTS="false"
          fi

          # Unit test project
          if [ "$INCLUDE_TESTS" = "true" ]; then
            check_file "$BASE/TestGenerator.Tests/TestGenerator.Tests.csproj"
            check_file "$BASE/TestGenerator.Tests/TestGeneratorTests.cs"
            check_file "$BASE/TestGenerator.Tests/TestHelper.cs"
            check_file "$BASE/TestGenerator.Tests/GlobalUsings.cs"
          else
            check_absent "$BASE/TestGenerator.Tests"
          fi

          # Snapshot test project and Verify setup example
          if [ "$INCLUDE_SNAPSHOT_TESTS" = "true" ]; then
            check_file "$BASE/TestGenerator.SnapshotTests/TestGenerator.SnapshotTests.csproj"
            check_file "$BASE/TestGenerator.SnapshotTests/TestGeneratorSnapshotTests.cs"
            check_file "$BASE/TestGenerator.SnapshotTests/TestHelper.cs"
            check_file "$BASE/TestGenerator.SnapshotTests/GlobalUsings.cs"
            check_file "$BASE/Directory.Build.props.example"
          else
            check_absent "$BASE/TestGenerator.SnapshotTests"
            check_absent "$BASE/Directory.Build.props.example"
          fi

          exit $EXIT_CODE

      - name: Configure Verify declaration for CI
        shell: bash
        working-directory: /tmp/TestGenerator
        run: |
          if [ -f "TestGenerator.SnapshotTests/TestGenerator.SnapshotTests.csproj" ]; then
            EXEMPT_UNTIL=$(date +%Y-%m)
            printf '<Project>\n  <PropertyGroup>\n    <Verify_SponsorshipExemption>OpenSource</Verify_SponsorshipExemption>\n    <Verify_SponsorshipExemptionUntil>%s</Verify_SponsorshipExemptionUntil>\n  </PropertyGroup>\n</Project>\n' "$EXEMPT_UNTIL" > Directory.Build.props
            echo "Configured Verify sponsorship exemption for CI."
          else
            echo "No snapshot test project generated; skipping Verify CI configuration."
          fi

      - name: Build generated project
        working-directory: /tmp/TestGenerator
        run: dotnet build TestGenerator.slnx --configuration Release

      - name: Run unit tests
        if: matrix.include-tests == 'true'
        working-directory: /tmp/TestGenerator
        run: dotnet run --project TestGenerator.Tests/TestGenerator.Tests.csproj --configuration Release --no-build

      - name: Run snapshot tests
        shell: bash
        working-directory: /tmp/TestGenerator
        run: |
          if [ -d "TestGenerator.SnapshotTests" ]; then
            dotnet run --project TestGenerator.SnapshotTests/TestGenerator.SnapshotTests.csproj --configuration Release --no-build
          else
            echo "No snapshot test project generated; skipping snapshot tests."
          fi
